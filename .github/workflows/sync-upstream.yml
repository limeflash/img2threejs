name: sync-upstream

# Merges hoainho/img2threejs into this fork's main once a day.
# Our only additions live at paths upstream never touches
# (.claude-plugin/, .github/workflows/sync-upstream.yml), so the merge
# fast-forwards cleanly. If upstream ever claims one of those paths the job
# fails loudly with a conflict instead of silently discarding either side.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream/main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/hoainho/img2threejs.git
          git fetch upstream main
          git merge --no-edit upstream/main
          git push
